[package]
name = "deskify"
version = "0.1.1-alpha.3"
edition = "2024"
rust-version = "1.95"
description = "Turn websites into first-class Linux desktop applications using Tauri and the system WebView"
license = "MIT"
readme = "README.md"
repository = "https://github.com/spalencsar/deskify"
keywords = ["desktop", "webapp", "tauri", "linux", "cli", "webview"]
categories = ["command-line-utilities", "gui"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive"] }
directories = "6.0.0"
image = "0.25.9"
regex = "1.12.3"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.25.0"
ureq = "2.9"
url = "2.5.8"
