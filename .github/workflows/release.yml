name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Prepare release asset
        run: |
          mkdir -p dist
          cp target/release/deskify dist/deskify-linux-x86_64

      - name: Upload GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/deskify-linux-x86_64
          generate_release_notes: true

      # Nach erfolgreichem Release das AUR-Paket (deskify-bin) triggern.
      # Das vermeidet Race Conditions, die früher zu falschen sha256sums führten,
      # weil aur-publish parallel zum Release lief und das Asset noch nicht fertig war.
      - name: Trigger AUR publish (deskify-bin)
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering aur-publish workflow for tag ${{ github.ref_name }}"
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/aur-publish.yml/dispatches" \
            -d '{"ref":"${{ github.ref }}","inputs":{"tag":"${{ github.ref_name }}"}}'
